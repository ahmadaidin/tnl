# SLSA Go builder configuration (https://github.com/slsa-framework/slsa-github-generator/blob/main/internal/builders/go/README.md)
# Consumed by .github/workflows/slsa.yml via builder_go_slsa3.yml@v2.1.0.
version: 1

env:
