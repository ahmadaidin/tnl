# SLSA provenance for tnl release builds.
#
# Push a v* tag to publish tnl-linux-amd64 and its signed
# tnl-linux-amd64.intoto.jsonl provenance to the matching GitHub release.
# workflow_dispatch builds the binary and provenance without touching any
# release (upload-assets: false).
#
# Repository requirement: Actions must be allowed to mint OIDC tokens, and
# the id-token: write / contents: write / actions: read permissions below must
# not be restricted by organization policy.
name: SLSA release provenance

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: read-all

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Compute release version
        id: metadata
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: release-metadata
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/builder_go_slsa3.yml@v2.1.0
    with:
      go-version-file: go.mod
      config-file: .slsa-goreleaser.yml
      evaluated-envs: "VERSION:${{ needs.release-metadata.outputs.version }}"
      upload-assets: ${{ startsWith(github.ref, 'refs/tags/v') }}
      upload-tag-name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
